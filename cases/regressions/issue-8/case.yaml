format: 1
id: regressions/issue-8
feature: doc.layout.page-setup
intent: >-
  A partial layout.pageSetup changes only the section fields it names (A4 stays A4) and refuses
  fields a section doesn't have; layout.size with a width and height keeps them as given (wider
  than tall is landscape); vertical alignment is drawn on its page even when another section
  follows; keep with next holds a heading with the two first lines a widow-controlled paragraph
  needs, at the foot of a page and of a column; a continuous section's columns draw the lines
  between them.
layer: gate
source:
  kind: issue
  from: Kition Doc regression suite
  license: owned
input: []
steps:
  - cargo-test:
      package: kition-doc-engine
      test: page_setup_commands
  - cargo-test:
      package: kition-doc-engine
      test: printed_look
      filter: a_continuous_section_draws_the_line_between_its_columns
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
timeout_s: 60
since: "2026-11-17"
