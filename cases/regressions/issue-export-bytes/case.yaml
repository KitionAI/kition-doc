format: 1
id: regressions/issue-export-bytes
feature: doc.file.export-print
intent: >-
  `file.export` answers the document as PDF, or one page as PNG, as base64 without writing a file
  or changing the document, and kit.json declares those exports for the host and the agent's
  `doc_export` (`exports`, `agent.export`); the headless kit answers every declared format to the
  agent and writes no file itself.
layer: gate
