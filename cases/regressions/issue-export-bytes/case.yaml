  kind: probe
  from: bindings/wasm/tests/export.rs, bindings/headless/tests/export.rs
  license: owned
input: []
steps:
  - cargo-test:
      package: kition-doc-kit
      test: export
  - cargo-test:
      package: kition-doc
      test: export
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
timeout_s: 120
since: "2026-11-17"
