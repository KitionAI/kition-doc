format: 1
id: regressions/issue-c8-doc-6-picture-number
feature: doc.agent.guard
intent: >-
  A picture has its number (the file's wp:docPr/@id, its tool id), as a drawing object has: an
  agent names it by `on`, and a picture command rests on it and on its bitmap. Another agent's
  border on the picture, or another program's new bitmap under the same name, refuses the agent's
  recolouring; another paragraph's text does not.
layer: gate
tags: [agents, pictures]
