format: 1
id: regressions/issue-merge-ids-in-step
feature: doc.collab.drafts
intent: >-
  The tool ids the engine makes unique after a draft's merge (paragraphs both sides numbered alike)
  are written into the replica's own undo step of the merge (kition-sdk Replica::transact_in_step,
  DocSession::record_in_step), not a change of their own: the merge raises the replica's undo depth
  by one, the history's step is that one replica step, one Undo of the person gives back the exact
  state hash from before the merge and one Redo the exact merged state with the ids. Before, the
  ids were a second person step on the replica that the history counted into the merge's step.
layer: gate
tags: [collab, kdm]
