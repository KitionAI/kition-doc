[package]
name = "kition-doc-kit"
description = "The Doc engine for Kition's in-page editor: open, edit, and save Kition Doc documents (Word .docx) from JavaScript (WebAssembly), on the Kition SDK."
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
kition-kit = { workspace = true, features = ["session"] }
kdm-model = { workspace = true }
kition-office-core = { workspace = true }
kition-doc-engine = { workspace = true }
kition-doc-fonts = { workspace = true }
kition-doc-doc = { workspace = true }
kition-doc-layout = { workspace = true }
kition-doc-render = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The exported files (`file.export`) come back as base64.
base64 = { workspace = true }
# The conformance fixture writer (examples/checks.rs) takes parts out of a written package.
zip = { workspace = true }
image = { workspace = true }
# The Kition platform convergence suite (L6), on the same kition-sdk revision.
kition-convergence = { workspace = true }
