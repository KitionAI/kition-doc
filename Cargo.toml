[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "tools/xtask"]
default-members = ["crates/*/*", "bindings/headless", "tools/xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-doc"

[workspace.dependencies]
# kition-sdk, pinned by commit (one revision for every crate of it)
kition-convergence = { git = "https://github.com/KitionAI/kition-sdk", rev = "6a57d68f3555f24c14def0ac57d14646bf95aa01" }
kition-office-core = { git = "https://github.com/KitionAI/kition-sdk", rev = "6a57d68f3555f24c14def0ac57d14646bf95aa01" }
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "6a57d68f3555f24c14def0ac57d14646bf95aa01" }
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "6a57d68f3555f24c14def0ac57d14646bf95aa01" }
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "6a57d68f3555f24c14def0ac57d14646bf95aa01" }
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "6a57d68f3555f24c14def0ac57d14646bf95aa01" }
# A host of kit processes (`HeadlessKit`), for the `document.identity` tests.
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "6a57d68f3555f24c14def0ac57d14646bf95aa01" }
# internal
kition-doc-geom = { path = "crates/support/geom" }
kition-doc-doc = { path = "crates/engine/doc" }
kition-doc-fonts = { path = "crates/support/fonts" }
kition-doc-layout = { path = "crates/engine/layout" }
kition-doc-docx = { path = "crates/formats/docx" }
kition-doc-docbin = { path = "crates/formats/docbin" }
kition-doc-formats = { path = "crates/formats/formats" }
kition-doc-render = { path = "crates/render/render" }
kition-doc-pdf = { path = "crates/formats/pdf" }
kition-doc-proof = { path = "crates/engine/proof" }
kition-doc-engine = { path = "crates/engine/engine" }
kition-doc-metafile = { path = "crates/formats/metafile" }
kdm-model = { path = "crates/kdm/kdm-model" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-script = "0.5"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
krilla = { version = "0.8", features = ["pdf"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
cfb = "0.15"
# Password-protected (agile-encrypted) Word documents: pure-Rust RustCrypto primitives.
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
