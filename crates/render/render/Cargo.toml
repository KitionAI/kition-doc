[package]
name = "kition-doc-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kition Doc rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
kition-doc-geom = { workspace = true }
kition-doc-doc = { workspace = true }
kition-doc-fonts = { workspace = true }
kition-doc-layout = { workspace = true }
kition-doc-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
